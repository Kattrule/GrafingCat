<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  
  <!-- Bakgrund med rundade hörn -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Svaga gitterlinjer -->
  <line x1="90" y1="370" x2="422" y2="370" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
  <line x1="90" y1="270" x2="422" y2="270" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
  <line x1="90" y1="170" x2="422" y2="170" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
  
  <!-- Graf-linje -->
  <path d="M 110 330 L 200 230 L 300 280 L 400 150" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Datapunkter -->
  <circle cx="110" cy="330" r="18" fill="#ffffff"/>
  <circle cx="200" cy="230" r="18" fill="#ffffff"/>
  <circle cx="300" cy="280" r="18" fill="#ffffff"/>
  <circle cx="400" cy="150" r="18" fill="#ffffff"/>
</svg>
